<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>{% block title %}MAAE PRIME STUDIO 🌍{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v=100">
</head>
<body>

    <!-- Global Navigation Header -->
    <header class="maae-navbar">
        <div style="display: flex; align-items: center; gap: 8px;">
            <span style="font-size: 18px;">🌍</span>
            <div>
                <h1 style="font-size: 13px; font-weight: 800; margin: 0; color: #e9edef;">MAAE ECOSYSTEM</h1>
                <div style="font-size: 8px; color: var(--accent-emerald); letter-spacing: 1px; text-transform: uppercase;">Next-Century Core</div>
            </div>
        </div>
        <nav class="maae-nav-tabs">
            <a href="{{ url_for('studio') }}" class="maae-nav-link {% if active_page == 'studio' %}active{% endif %}">Studio</a>
            <a href="{{ url_for('vault') }}" class="maae-nav-link {% if active_page == 'vault' %}active{% endif %}">Vault</a>
            <a href="{{ url_for('community') }}" class="maae-nav-link {% if active_page == 'community' %}active{% endif %}">Community</a>
            <a href="/founder/dashboard" class="maae-nav-link {% if active_page == 'dashboard' %}active{% endif %}">Dashboard</a>
        </nav>
    </header>

    <!-- Main Content Container -->
    <main class="maae-container">
        {% block content %}{% endblock %}
    </main>

    <!-- Global Footer -->
    <footer class="maae-footer">
        <p style="margin: 0; font-weight: bold; color: var(--text-primary);">MAAE PRIME STUDIO | Next-Century Autonomous Media</p>
        <p style="margin: 4px 0 0;">&copy; 2026 MAAE Ecosystem Inc. All rights reserved.</p>
    </footer>

</body>
</html>
