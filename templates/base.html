<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>{% block title %}MAAE PRIME STUDIO 🌍{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body style="background: #090d16; color: #f3f4f6; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; margin: 0; padding: 0; box-sizing: border-box; overflow-x: hidden;">

    <!-- Global Navigation Header -->
    <header style="background: #11151c; border-bottom: 1px solid #30363d; padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 500; width: 100%; box-sizing: border-box;">
        <div style="display: flex; align-items: center; gap: 8px;">
            <span style="font-size: 18px;">🌍</span>
            <div>
                <h1 style="font-size: 13px; font-weight: 800; color: #f3f4f6; margin: 0;">MAAE ECOSYSTEM</h1>
                <div style="font-size: 8px; color: #f59e0b; letter-spacing: 1px; text-transform: uppercase;">Next-Century Core</div>
            </div>
        </div>
        <nav style="display: flex; gap: 4px; overflow-x: auto;">
             <a href="{{ url_for('studio') }}" style="background: {{ '#f59e0b' if active_page == 'studio' else '#1f2937' }}">Studio</a>
             <a href="{{ url_for('vault') }}" style="background: {{ '#f59e0b' if active_page == 'vault' else '#1f2937' }}">Vault</a>
             <a href="{{ url_for('community') }}" style="background: {{ '#f59e0b' if active_page == 'community' else '#1f2937' }}">Commons</a>
             <a href="/founder/dashboard" style="background: {{ '#f59e0b' if active_page == 'founder' else '#1f2937' }}">Dashboard</a>
             <a href="/founder/telemetry" style="background: #1f2937; color: #10b981; border: 1px solid #10b981; text-decoration: none;">🛰️ Tracker</a>
             <a href="/founder/gate" style="background: #1f2937; color: #f59e0b; border: 1px dashed #f59e0b; text-decoration: none;">🔒 Gate</a>
        </nav>
    </header>

    <!-- Main Content Container with mobile cushion -->
    <main style="width: 100%; max-width: 480px; margin: 0 auto; padding: 12px; box-sizing: border-box;">
        {% block content %}{% endblock %}
    </main>
     
    <!-- Global Footer -->
    <footer style="background: #06080e; border-top: 1px solid #30363d; padding: 15px 12px; text-align: center; font-size: 9px; color: #6b7280; margin-top: 30px; box-sizing: border-box;">
        <div style="max-width: 480px; margin: 0 auto;">
            <p style="margin: 0; color: #9ca3af; font-weight: bold;">MAAE PRIME STUDIO™ | Next-Century Autonomous Media Engine</p>
            <p style="margin: 4px 0 0 0; color: #4b5563;">© 2026 MAAE Ecosystem Inc. All rights reserved.</p>
        </div>
    </footer>
</body>
</html>
