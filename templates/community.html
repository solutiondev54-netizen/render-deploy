{% extends "base.html" %}
{% block title %}Community Commons | MAAE Ecosystem{% endblock %}
{% block content %}
<div style="max-width: 650px; margin: 15px auto; background: linear-gradient(135deg, #161b22, #11151c); border: 1px solid #30363d; border-radius: 12px; display: flex; flex-direction: column; height: 75vh; overflow: hidden;">
    
    <!-- Chat Header -->
    <div style="background: #0d1117; padding: 12px 15px; border-bottom: 1px solid #30363d; display: flex; justify-content: space-between; align-items: center;">
        <div>
            <h2 style="color: #f59e0b; font-size: 13px; margin: 0;">💬 MAAE WhatsApp-Grade Commons</h2>
            <span style="color: #10b981; font-size: 8px;">● Secure Encrypted Node • Live Stream Active</span>
        </div>
        <span id="recording-status" style="color: #ef4444; font-size: 9px; font-weight: bold; display: none;">🔴 Recording Voice Note...</span>
    </div>

    <!-- Message Feed Window -->
    <div id="chat-messages" style="flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; background: #0b0f15;">
        <!-- Dynamic messages load here -->
    </div>

    <!-- Input & Audio Control Bar -->
    <div style="background: #0d1117; padding: 10px; border-top: 1px solid #30363d; display: flex; gap: 8px; align-items: center;">
        <input type="text" id="chat-input" placeholder="Type a broadcast message..." style="flex: 1; padding: 10px; background: #161b22; border: 1px solid #30363d; color: #fff; border-radius: 6px; font-size: 10px;">
        
        <button type="button" onclick="sendTextMessage()" style="background: #f59e0b; color: #000; border: none; padding: 10px 14px; border-radius: 6px; font-weight: bold; font-size: 10px; cursor: pointer;">Send</button>
        
        <button type="button" id="mic-btn" onclick="toggleVoiceRecord()" style="background: #1f2937; color: #ef4444; border: 1px solid #ef4444; padding: 10px 12px; border-radius: 6px; font-size: 12px; cursor: pointer;" title="Hold or Tap to Record Voice Note">🎙️</button>
    </div>
</div>

<script>
    let mediaRecorder;
    let audioChunks = [];
    let isRecording = false;

    async function fetchMessages() {
        try {
            const res = await fetch('/api/community/messages');
            const data = await res.json();
            if (data.success) {
                const feed = document.getElementById('chat-messages');
                feed.innerHTML = '';
                data.messages.forEach(m => {
                    const bubble = document.createElement('div');
                    bubble.style.background = m.user === 'Founder' ? '#1f2633' : '#161b22';
                    bubble.style.border = '1px solid #30363d';
                    bubble.style.padding = '8px 12px';
                    bubble.style.borderRadius = '8px';
                    bubble.style.maxWidth = '80%';
                    bubble.style.alignSelf = m.user === 'Founder' ? 'flex-end' : 'flex-start';
                    
                    let contentHtml = `<span style="color: #f59e0b; font-size: 8px; font-weight: bold; display: block; margin-bottom: 2px;">${m.user}</span>`;
                    if (m.type === 'voice') {
                        contentHtml += `<audio controls src="${m.content}" style="height: 30px; width: 200px; margin-top: 4px;"></audio>`;
                    } else {
                        contentHtml += `<span style="color: #fff; font-size: 10px;">${m.content}</span>`;
                    }
                    bubble.innerHTML = contentHtml;
                    feed.appendChild(bubble);
                });
                feed.scrollTop = feed.scrollHeight;
            }
        } catch (err) {
            console.error("Failed to sync chat feed.");
        }
    }

    async function sendTextMessage() {
        const input = document.getElementById('chat-input');
        const text = input.value.trim();
        if (!text) return;

        await fetch('/api/community/messages', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ user: 'Founder', type: 'text', content: text })
        });
        input.value = '';
        fetchMessages();
    }

    async function toggleVoiceRecord() {
        const statusIndicator = document.getElementById('recording-status');
        const micBtn = document.getElementById('mic-btn');

        if (!isRecording) {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];

                mediaRecorder.ondataavailable = event => {
                    audioChunks.push(event.data);
                };

                mediaRecorder.onstop = async () => {
                    const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                    const reader = new FileReader();
                    reader.readAsDataURL(audioBlob);
                    reader.onloadend = async function () {
                        const base64Audio = reader.result;
                        await fetch('/api/community/messages', {
                            method: 'POST',
                            headers: {'Content-Type': 'application/json'},
                            body: JSON.stringify({ user: 'Founder', type: 'voice', content: base64Audio })
                        });
                        fetchMessages();
                    };
                };

                mediaRecorder.start();
                isRecording = true;
                statusIndicator.style.display = 'block';
                micBtn.style.background = '#7f1d1d';
            } catch (err) {
                alert("Microphone access denied or unsupported on this browser node.");
            }
        } else {
            mediaRecorder.stop();
            isRecording = false;
            statusIndicator.style.display = 'none';
            micBtn.style.background = '#1f2937';
        }
    }

    // Auto-poll message sync every 4 seconds
    setInterval(fetchMessages, 4000);
    fetchMessages();
</script>
{% endblock %}
