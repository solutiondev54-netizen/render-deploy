{% extends "base.html" %}
{% block title %}Founder Security Gate | MAAE Ecosystem{% endblock %}
{% block content %}
<div style="max-width: 400px; margin: 40px auto; background: linear-gradient(135deg, #161b22, #11151c); border: 1px solid #f59e0b; border-radius: 12px; padding: 20px; text-align: center;">
    <div style="font-size: 28px; margin-bottom: 10px;">🔒</div>
    <h2 style="color: #f59e0b; font-size: 14px; text-transform: uppercase; margin-bottom: 6px;">Founder Restricted Access</h2>
    <p style="color: #9ca3af; font-size: 10px; margin-bottom: 15px;">Enter master security passcode to access the supreme command core.</p>
    
    <input type="password" id="passcode-input" placeholder="Enter Founder Passcode..." style="width: 100%; padding: 10px; background: #0d1117; border: 1px solid #30363d; color: #fff; border-radius: 6px; box-sizing: border-box; font-size: 11px; margin-bottom: 12px; text-align: center;">
    
    <button type="button" onclick="verifyPasscode()" style="width: 100%; padding: 10px; background: linear-gradient(135deg, #f59e0b, #d97706); color: #000; border: none; border-radius: 6px; font-weight: bold; font-size: 10px; text-transform: uppercase; cursor: pointer;">Unlock Command Center</button>
    <div id="error-msg" style="color: #ef4444; font-size: 9px; margin-top: 8px;"></div>
</div>

<script>
    async function verifyPasscode() {
        const passcode = document.getElementById('passcode-input').value;
        const errorDiv = document.getElementById('error-msg');
        try {
            const res = await fetch('/founder/gate', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ passcode: passcode })
            });
            const data = await res.json();
            if (data.success) {
                window.location.href = data.redirect;
            } else {
                errorDiv.innerText = data.message;
            }
        } catch (err) {
            errorDiv.innerText = "Connection error to core security node.";
        }
    }
</script>
{% endblock %}
