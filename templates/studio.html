{% extends "base.html" %}
{% block title %}Studio Mixer | MAAE Ecosystem{% endblock %}
{% block content %}
<!-- Version Vault Tracker & Directives -->
<div style="background: linear-gradient(135deg, #161b22, #11151c); border: 1px solid #30363d; border-radius: 10px; padding: 12px; margin-bottom: 10px;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
        <span style="color: #f2c94c; font-size: 10px; font-weight: 700; text-transform: uppercase;">Version Vault Tracker</span>
        <button type="button" id="save-vault-btn" style="background: rgba(16, 185, 129, 0.2); color: #10b981; border: 1px solid #10b981; padding: 3px 8px; border-radius: 4px; font-size: 9px; font-weight: bold; cursor: pointer;">💾 Save to Vault</button>
    </div>

    <label style="color: #f2c94c; font-size: 10px; font-weight: 700; text-transform: uppercase; display: block; margin-bottom: 6px;">Studio Directive Manifest</label>
    <div style="display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px;">
        <button type="button" class="preset-btn" data-character="Mama Akos" style="background: #1f2937; color: #f3f4f6; border: 1px solid #30363d; padding: 6px 10px; border-radius: 6px; font-size: 10px; font-weight: bold; cursor: pointer;">Mama Akos</button>
        <button type="button" class="preset-btn" data-character="Kofi" style="background: #1f2937; color: #f3f4f6; border: 1px solid #30363d; padding: 6px 10px; border-radius: 6px; font-size: 10px; font-weight: bold; cursor: pointer;">Kofi</button>
        <button type="button" class="preset-btn" data-character="Papa Kofi" style="background: #1f2937; color: #f3f4f6; border: 1px solid #30363d; padding: 6px 10px; border-radius: 6px; font-size: 10px; font-weight: bold; cursor: pointer;">Papa Kofi</button>
        <button type="button" class="preset-btn" data-character="Akos Kofi's sister" style="background: #1f2937; color: #f3f4f6; border: 1px solid #30363d; padding: 6px 10px; border-radius: 6px; font-size: 10px; font-weight: bold; cursor: pointer;">Akos Kofi's sister</button>
    </div>

    <label style="color: #f2c94c; font-size: 10px; font-weight: 700; text-transform: uppercase; display: block; margin-bottom: 6px;">Emotion & Sentiment Tags</label>
    <div style="display: flex; gap: 6px;">
        <button type="button" class="tag-btn" data-tag="😂 [Laughs]" style="background: #1f2937; color: #f3f4f6; border: 1px solid #30363d; padding: 4px 8px; border-radius: 4px; font-size: 9px; cursor: pointer;">😂 [Laughs]</button>
        <button type="button" class="tag-btn" data-tag="❄️ [Sighs]" style="background: #1f2937; color: #f3f4f6; border: 1px solid #30363d; padding: 4px 8px; border-radius: 4px; font-size: 9px; cursor: pointer;">❄️ [Sighs]</button>
        <button type="button" class="tag-btn" data-tag="🔥 [Whisper]" style="background: #1f2937; color: #f3f4f6; border: 1px solid #30363d; padding: 4px 8px; border-radius: 4px; font-size: 9px; cursor: pointer;">🔥 [Whisper]</button>
    </div>
</div>

<!-- Plot Idea / Prompt & Dialect Styles -->
<div style="background: linear-gradient(135deg, #161b22, #11151c); border: 1px solid #30363d; border-radius: 10px; padding: 12px; margin-bottom: 10px;">
    <label style="color: #f2c94c; font-size: 10px; font-weight: 700; text-transform: uppercase; display: block; margin-bottom: 6px;">Plot Idea / Prompt</label>
    <input type="text" id="prompt-input" placeholder="Enter plot idea here..." style="width: 100%; padding: 8px; background: #0d1117; border: 1px solid #30363d; color: #fff; border-radius: 6px; box-sizing: border-box; font-size: 11px; margin-bottom: 10px;">

    <label style="color: #f2c94c; font-size: 10px; font-weight: 700; text-transform: uppercase; display: block; margin-bottom: 6px;">Select Dialect Style</label>
    <div style="display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px;">
        <button type="button" class="dialect-btn" data-dialect="Classic Family" style="background: #1f2937; color: #f2c94c; border: 1px solid #f2c94c; padding: 6px 10px; border-radius: 6px; font-size: 10px; cursor: pointer;">Classic Family</button>
        <button type="button" class="dialect-btn" data-dialect="Accra Pidgin" style="background: #1f2937; color: #f3f4f6; border: 1px solid #30363d; padding: 6px 10px; border-radius: 6px; font-size: 10px; cursor: pointer;">Accra Pidgin</button>
        <button type="button" class="dialect-btn" data-dialect="Lagos Street" style="background: #1f2937; color: #f3f4f6; border: 1px solid #30363d; padding: 6px 10px; border-radius: 6px; font-size: 10px; cursor: pointer;">Lagos Street</button>
    </div>

    <button type="button" id="generate-script-btn" style="width: 100%; padding: 10px; background: linear-gradient(135deg, #f59e0b, #d97706); color: #000; border: none; border-radius: 6px; font-weight: bold; font-size: 10px; text-transform: uppercase; cursor: pointer;">Script Engine Matrix</button>
</div>

<!-- Script Workspace -->
<div style="background: linear-gradient(135deg, #161b22, #11151c); border: 1px solid #30363d; border-radius: 10px; padding: 12px; margin-bottom: 10px;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
        <label style="color: #f2c94c; font-size: 10px; font-weight: 700; text-transform: uppercase;">Script Workspace</label>
        <span id="word-count" style="color: #9ca3af; font-size: 9px;">0 words (~0 sec)</span>
    </div>
    <textarea id="workspace" placeholder="Script Workspace output stream..." style="width: 100%; height: 110px; background: #0d1117; border: 1px solid #30363d; color: #f3f4f6; padding: 8px; border-radius: 6px; box-sizing: border-box; font-size: 11px;"></textarea>
</div>

<!-- Background Soundscape Vibe & Ambient FX -->
<div style="background: linear-gradient(135deg, #161b22, #11151c); border: 1px solid #30363d; border-radius: 10px; padding: 12px; margin-bottom: 10px;">
    <label style="color: #f2c94c; font-size: 10px; font-weight: 700; text-transform: uppercase; display: block; margin-bottom: 6px;">Background Soundscape Vibe</label>
    <div style="display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px;">
        <button type="button" class="vibe-btn" style="background: #1f2937; color: #f3f4f6; border: 1px solid #30363d; padding: 5px 8px; border-radius: 6px; font-size: 9px; cursor: pointer;">🚫 None</button>
        <button type="button" class="vibe-btn" style="background: #1f2937; color: #f3f4f6; border: 1px solid #30363d; padding: 5px 8px; border-radius: 6px; font-size: 9px; cursor: pointer;">🛒 Accra Market</button>
        <button type="button" class="vibe-btn" style="background: #1f2937; color: #f2c94c; border: 1px solid #f2c94c; padding: 5px 8px; border-radius: 6px; font-size: 9px; cursor: pointer;">🚗 Lagos Traffic</button>
        <button type="button" class="vibe-btn" style="background: #1f2937; color: #f3f4f6; border: 1px solid #30363d; padding: 5px 8px; border-radius: 6px; font-size: 9px; cursor: pointer;">🎶 Chill Highlife</button>
    </div>

    <label style="color: #f2c94c; font-size: 10px; font-weight: 700; text-transform: uppercase; display: block; margin-bottom: 4px;">Ambient FX Volume: <span id="vol-val">50%</span></label>
    <input type="range" id="vol-slider" min="0" max="100" value="50" style="width: 100%; accent-color: #f59e0b;">
</div>

<!-- Visual Studio Feed & Direct Social Hub -->
<div style="background: linear-gradient(135deg, #161b22, #11151c); border: 1px solid #30363d; border-radius: 10px; padding: 12px; text-align: center; margin-bottom: 15px;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
        <label style="color: #f2c94c; font-size: 10px; font-weight: 700; text-transform: uppercase;">Visual Studio Feed & Assets</label>
        <span style="background: #6b21a8; color: #fff; padding: 2px 6px; border-radius: 4px; font-size: 8px; font-weight: bold;">WEBGPU AI</span>
    </div>
    <div id="visual-output" style="background: #0d1117; border: 1px dashed #30363d; height: 110px; border-radius: 6px; display: flex; align-items: center; justify-content: center; color: #64748b; font-size: 10px; margin-bottom: 10px;">
        Awaiting Script Generation... Click below to render visual.
    </div>

    <button type="button" id="render-visual-btn" style="width: 100%; padding: 10px; background: #10b981; color: #000; border: none; border-radius: 6px; font-weight: bold; font-size: 10px; text-transform: uppercase; cursor: pointer; margin-bottom: 12px;">Render Video / Cinematic Visual</button>

    <label style="color: #f2c94c; font-size: 10px; font-weight: 700; text-transform: uppercase; display: block; margin-bottom: 6px; text-align: left;">Direct Social Broadcast Hub</label>
    <div style="display: flex; gap: 6px;">
        <button type="button" style="flex: 1; padding: 6px; background: #000; color: #fff; border: 1px solid #30363d; border-radius: 6px; font-size: 9px; font-weight: bold; cursor: pointer;">🎵 TikTok</button>
        <button type="button" style="flex: 1; padding: 6px; background: #db2777; color: #fff; border: none; border-radius: 6px; font-size: 9px; font-weight: bold; cursor: pointer;">📸 Reels</button>
        <button type="button" style="flex: 1; padding: 6px; background: #dc2626; color: #fff; border: none; border-radius: 6px; font-size: 9px; font-weight: bold; cursor: pointer;">▶️ Shorts</button>
    </div>
</div>

<script>
    let activeDialect = "Classic Family";

    document.addEventListener('DOMContentLoaded', () => {
        // Preset Character Buttons
        document.querySelectorAll('.preset-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const character = btn.getAttribute('data-character');
                const input = document.getElementById('prompt-input');
                input.value = `Focus scene heavily on character ${character}: `;
                input.focus();
            });
        });

        // Emotion & Sentiment Tags
        document.querySelectorAll('.tag-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const tag = btn.getAttribute('data-tag');
                const workspace = document.getElementById('workspace');
                workspace.value += ` ${tag} `;
                updateWordCount();
            });
        });

        // Dialect Selector Buttons
        document.querySelectorAll('.dialect-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.dialect-btn').forEach(b => {
                    b.style.color = "#f3f4f6";
                    b.style.borderColor = "#30363d";
                });
                btn.style.color = "#f2c94c";
                btn.style.borderColor = "#f2c94c";
                activeDialect = btn.getAttribute('data-dialect');
            });
        });

        // Soundscape Vibe Buttons
        document.querySelectorAll('.vibe-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.vibe-btn').forEach(b => {
                    b.style.color = "#f3f4f6";
                    b.style.borderColor = "#30363d";
                });
                btn.style.color = "#f2c94c";
                btn.style.borderColor = "#f2c94c";
            });
        });

        // Volume Slider Output Handler
        const volSlider = document.getElementById('vol-slider');
        if (volSlider) {
            volSlider.addEventListener('input', (e) => {
                document.getElementById('vol-val').innerText = e.target.value + '%';
            });
        }

        // Workspace Typing Counter
        const workspace = document.getElementById('workspace');
        if (workspace) {
            workspace.addEventListener('input', updateWordCount);
        }

        // Script Generation Button Binding
        const generateBtn = document.getElementById('generate-script-btn');
        if (generateBtn) {
            generateBtn.addEventListener('click', generateScript);
        }

        // Save to Vault Button Binding
        const saveVaultBtn = document.getElementById('save-vault-btn');
        if (saveVaultBtn) {
            saveVaultBtn.addEventListener('click', saveToVault);
        }

        // Render Visual Button Binding
        const renderVisualBtn = document.getElementById('render-visual-btn');
        if (renderVisualBtn) {
            renderVisualBtn.addEventListener('click', renderVisual);
        }
    });

    function updateWordCount() {
        const text = document.getElementById('workspace').value;
        const words = text.trim() ? text.trim().split(/\s+/).length : 0;
        const seconds = Math.round(words * 0.4);
        document.getElementById('word-count').innerText = `${words} words (~${seconds} sec)`;
    }

    async function generateScript() {
        const input = document.getElementById('prompt-input').value;
        const workspace = document.getElementById('workspace');
        workspace.value = "Connecting to Gemini Neural Core...";
        try {
            const res = await fetch('/api/generate', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ prompt: `[Dialect: ${activeDialect}] ${input}` })
            });
            const data = await res.json();
            workspace.value = data.script || data.message || "Error generating content.";
            updateWordCount();
        } catch (err) {
            workspace.value = "Network Error: Failed to reach server.";
        }
    }

    function saveToVault() {
        const scriptText = document.getElementById('workspace').value;
        if (!scriptText.trim()) {
            alert('Workspace is empty!');
            return;
        }
        let vault = JSON.parse(localStorage.getItem('maae_vault') || '[]');
        vault.unshift({ script: scriptText, date: new Date().toLocaleDateString() + ' ' + new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) });
        localStorage.setItem('maae_vault', JSON.stringify(vault));
        alert('Script successfully secured in Version Vault Tracker!');
    }

    async function renderVisual() {
        const visualBox = document.getElementById('visual-output');
        visualBox.innerHTML = "Synthesizing multimodal visual asset via WebGPU AI...";
        const promptText = document.getElementById('prompt-input').value || "Cinematic West African comedy scene";
        try {
            const res = await fetch('/api/render-video', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ prompt: promptText })
            });
            const data = await res.json();
            if (data.url) {
                visualBox.innerHTML = `<img src="${data.url}" style="width: 100%; height: 100%; object-fit: cover; border-radius: 6px;">`;
            } else {
                visualBox.innerHTML = "Failed to load visual stream.";
            }
        } catch (err) {
            visualBox.innerHTML = "Visual pipeline offline.";
        }
    }

function runScriptEngineMatrix() {
    const promptInput = document.getElementById('plot-prompt-input');
    const outputWorkspace = document.getElementById('script-workspace-output');
    const prompt = promptInput.value;
    
    if(!prompt) {
        alert('Please enter a plot idea or prompt.');
        return;
    }
    
    outputWorkspace.value = 'Compiling script engine matrix across nodes...';
    
    fetch('/founder/api/studio/generate-clip', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ 
            prompt: prompt,
            dialect: 'Accra Pidgin' // You can capture selected dialect dynamically here
        })
    })
    .then(res => res.json())
    .then(data => {
        if(data.success) {
            outputWorkspace.value = data.output_script;
        } else {
            outputWorkspace.value = 'Error compiling script matrix.';
        }
    })
    .catch(err => {
        outputWorkspace.value = 'Network connection error during matrix sync.';
    });
}
</script>
{% endblock %}
