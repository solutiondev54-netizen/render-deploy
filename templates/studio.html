{% extends "base.html" %}
{% block title %}Studio Mixer | MAAE Ecosystem{% endblock %}
{% block content %}
<!-- Presets & Input -->
<div style="background: linear-gradient(135deg, #161b22, #11151c); border: 1px solid #30363d; border-radius: 10px; padding: 12px; margin-bottom: 10px;">
    <label style="color: #f2c94c; font-size: 10px; font-weight: 700; text-transform: uppercase; display: block; margin-bottom: 6px;">Select Family Lead / Preset</label>
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 10px;">
        <button type="button" onclick="setPreset('AKOS')" style="background: #1f2937; color: #f3f4f6; border: 1px solid #30363d; padding: 8px; border-radius: 6px; font-size: 10px; font-weight: bold; cursor: pointer;">👩‍🦱 AKOS (Daughter)</button>
        <button type="button" onclick="setPreset('KOFI')" style="background: #1f2937; color: #f3f4f6; border: 1px solid #30363d; padding: 8px; border-radius: 6px; font-size: 10px; font-weight: bold; cursor: pointer;">🧑‍🦲 KOFI (Brother)</button>
        <button type="button" onclick="setPreset('MAMA AKOS')" style="background: #1f2937; color: #f3f4f6; border: 1px solid #30363d; padding: 8px; border-radius: 6px; font-size: 10px; font-weight: bold; cursor: pointer;">👩‍🦳 MAMA AKOS (Mother)</button>
        <button type="button" onclick="setPreset('PAPA AKOS')" style="background: #1f2937; color: #f3f4f6; border: 1px solid #30363d; padding: 8px; border-radius: 6px; font-size: 10px; font-weight: bold; cursor: pointer;">👨‍🦳 PAPA AKOS (Father)</button>
    </div>

    <label style="color: #f2c94c; font-size: 10px; font-weight: 700; text-transform: uppercase; display: block; margin-bottom: 6px;">Neural Plot Directive</label>
    <input type="text" id="prompt-input" placeholder="Enter comedy plot idea..." style="width: 100%; padding: 8px; background: #0d1117; border: 1px solid #30363d; color: #fff; border-radius: 6px; box-sizing: border-box; font-size: 11px; margin-bottom: 8px;">
    
    <button type="button" onclick="generateScript()" style="width: 100%; padding: 10px; background: linear-gradient(135deg, #f59e0b, #d97706); color: #fff; border: none; border-radius: 6px; font-weight: bold; font-size: 10px; text-transform: uppercase; cursor: pointer;">Synthesize Script Matrix</button>
</div>

<!-- Live Script Workspace + Vault Save -->
<div style="background: linear-gradient(135deg, #161b22, #11151c); border: 1px solid #30363d; border-radius: 10px; padding: 12px; margin-bottom: 10px;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
        <label style="color: #f2c94c; font-size: 10px; font-weight: 700; text-transform: uppercase;">Live Script Workspace</label>
        <button type="button" onclick="saveToVault()" style="background: #10b981; color: #000; border: none; padding: 3px 8px; border-radius: 4px; font-size: 9px; font-weight: bold; cursor: pointer;">💾 Save to Vault</button>
    </div>
    <textarea id="workspace" placeholder="Output stream..." style="width: 100%; height: 120px; background: #0d1117; border: 1px solid #30363d; color: #f3f4f6; padding: 8px; border-radius: 6px; box-sizing: border-box; font-size: 11px; margin-bottom: 8px;"></textarea>
    <button type="button" onclick="renderVisual()" style="width: 100%; padding: 8px; background: #1f2937; color: #f2c94c; border: 1px solid #f2c94c; border-radius: 6px; font-weight: bold; font-size: 10px; text-transform: uppercase; cursor: pointer;">🎬 Generate Visual Asset</button>
</div>

<!-- Visual Frame Output -->
<div style="background: linear-gradient(135deg, #161b22, #11151c); border: 1px solid #30363d; border-radius: 10px; padding: 12px; text-align: center;">
    <label style="color: #f2c94c; font-size: 10px; font-weight: 700; text-transform: uppercase; display: block; margin-bottom: 6px; text-align: left;">AI Visual Studio Frame</label>
    <div id="visual-output" style="background: #0d1117; border: 1px dashed #30363d; height: 140px; border-radius: 6px; display: flex; align-items: center; justify-content: center; color: #64748b; font-size: 11px; overflow: hidden;">
        No visual frame rendered yet.
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const loaded = localStorage.getItem('active_loaded_script');
        if (loaded) {
            document.getElementById('workspace').value = loaded;
            localStorage.removeItem('active_loaded_script');
        }
    });

    function setPreset(character) {
        const input = document.getElementById('prompt-input');
        input.value = `Focus scene heavily on ${character} and their hilarious reactions: `;
        input.focus();
    }

    async function generateScript() {
        const input = document.getElementById('prompt-input').value;
        const workspace = document.getElementById('workspace');
        workspace.value = "Connecting to Gemini Neural Core...";
        try {
            const res = await fetch('/api/generate', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ prompt: input })
            });
            const data = await res.json();
            workspace.value = data.script || data.message || "Error generating content.";
        } catch (err) {
            workspace.value = "Network Error: Failed to reach server.";
        }
    }

    function saveToVault() {
        const scriptText = document.getElementById('workspace').value;
        if (!scriptText.trim()) {
            alert('Workspace is empty!');
            return;
        }
        let vault = JSON.parse(localStorage.getItem('maae_vault') || '[]');
        vault.unshift({ script: scriptText, date: new Date().toLocaleDateString() + ' ' + new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) });
        localStorage.setItem('maae_vault', JSON.stringify(vault));
        alert('Script successfully secured in Version Vault!');
    }

    async function renderVisual() {
        const visualBox = document.getElementById('visual-output');
        visualBox.innerHTML = "Synthesizing multimodal visual asset via Gemini...";
        const promptText = document.getElementById('prompt-input').value || "Cinematic West African comedy scene";
        try {
            const res = await fetch('/api/render-video', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ prompt: promptText })
            });
            const data = await res.json();
            if (data.url) {
                visualBox.innerHTML = `<img src="${data.url}" style="width: 100%; height: 100%; object-fit: cover; border-radius: 6px;">`;
            } else {
                visualBox.innerHTML = "Failed to load visual stream.";
            }
        } catch (err) {
            visualBox.innerHTML = "Visual pipeline offline.";
        }
    }
</script>
{% endblock %}
